<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CivicConnect</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#eef1ff; --bg-2:#e3e9ff; --bg-3:#dceafe;
  --glass:rgba(255,255,255,.42); --glass-hi:rgba(255,255,255,.68);
  --border:rgba(255,255,255,.75); --shadow:0 12px 34px rgba(35,42,90,.16);
  --rim-top:rgba(255,255,255,.75); --rim-bottom:rgba(35,42,90,.06);
  --sheen:linear-gradient(155deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.08) 30%, rgba(255,255,255,0) 55%, rgba(255,255,255,.14) 100%);
  --text:#1c2036; --text-2:#5c6280; --text-3:#8a90ab;
  --accent:#5a4fe0; --accent-2:#3f7bf0; --accent-grad:linear-gradient(135deg,#6a5cf0,#3f7bf0);
  --success:#12a454; --success-2:#0e8a45; --warn:#e08a1e; --danger:#e0435a; --info:#3f7bf0;
  --nav:rgba(255,255,255,.62); --chip:rgba(255,255,255,.38);
  --radius-lg:26px; --radius-md:18px; --radius-sm:12px;
  --blur:blur(28px) saturate(190%);
}
  /* CiviConnect Darktheme */
[data-theme="dark"]{
  --bg-1:#05060d; --bg-2:#0a0d1c; --bg-3:#0e1330;
  --glass:rgba(22,26,48,.42); --glass-hi:rgba(28,32,58,.68);
  --border:rgba(255,255,255,.13); --shadow:0 12px 38px rgba(0,0,0,.6);
  --rim-top:rgba(255,255,255,.14); --rim-bottom:rgba(0,0,0,.4);
  --sheen:linear-gradient(155deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.03) 30%, rgba(255,255,255,0) 55%, rgba(139,131,255,.10) 100%);
  --text:#eef0fb; --text-2:#a7adce; --text-3:#767ca0;
  --accent:#8b83ff; --accent-2:#5b9dff; --accent-grad:linear-gradient(135deg,#8b83ff,#5b9dff);
  --success:#2fd47e; --success-2:#1fb56a; --warn:#f5a742; --danger:#ff6b7f; --info:#5b9dff;
  --nav:rgba(10,13,26,.58); --chip:rgba(255,255,255,.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif; color:var(--text);
  background:
    radial-gradient(circle at 12% -8%, var(--bg-3), transparent 50%),
    radial-gradient(circle at 105% 8%, var(--bg-2), transparent 45%),
    radial-gradient(circle at 40% 110%, var(--accent) 0%, transparent 32%),
    var(--bg-1);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:18px 0; transition:background .4s ease; position:relative; overflow:hidden;
}
body::before, body::after{
  content:''; position:fixed; border-radius:50%; filter:blur(70px); z-index:0; pointer-events:none;
  animation:floaty 14s ease-in-out infinite alternate;
}
body::before{width:340px; height:340px; background:radial-gradient(circle, rgba(90,79,224,.35), transparent 70%); top:-8%; left:-10%;}
body::after{width:300px; height:300px; background:radial-gradient(circle, rgba(63,123,240,.3), transparent 70%); bottom:-10%; right:-8%; animation-delay:-7s;}
@keyframes floaty{from{transform:translate(0,0) scale(1);} to{transform:translate(20px,-24px) scale(1.08);}}
h1,h2,h3,.display{font-family:'Manrope',sans-serif;}
.phone{
  width:390px; max-width:96vw; height:844px; max-height:94vh;
  background:var(--glass-hi); border:1px solid var(--border);
  border-radius:44px;
  box-shadow:0 30px 70px rgba(20,24,60,.3), 0 0 0 1px rgba(255,255,255,.05),
    inset 0 1px 0 var(--rim-top), inset 0 -1px 0 var(--rim-bottom);
  overflow:hidden; position:relative; display:flex; flex-direction:column;
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); z-index:1;
}
.phone::before{
  content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:var(--sheen); mix-blend-mode:soft-light;
}
.notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:26px; background:#000; border-radius:0 0 18px 18px; z-index:50;}
.statusbar{display:flex; justify-content:space-between; padding:16px 26px 4px; font-size:13px; font-weight:700; color:var(--text); flex-shrink:0;}
.screen-root{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; scrollbar-width:none;}
.screen-root::-webkit-scrollbar{display:none;}
.screen{padding:14px 20px 100px; animation:fadeUp .35s ease;}
.screen.no-pad-bottom{padding-bottom:24px;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ---- liquid glass components ---- */
.glass-card{
  background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow), inset 0 1px 0 var(--rim-top), inset 0 -1px 0 var(--rim-bottom);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  padding:18px; position:relative; overflow:hidden; isolation:isolate;
}
.glass-card::before{
  content:''; position:absolute; inset:0; z-index:-1; border-radius:inherit;
  background:var(--sheen); mix-blend-mode:soft-light; pointer-events:none;
}
.glass-card.tight{padding:14px;}
.btn{
  border:none; border-radius:16px; padding:15px 20px; font-family:'Inter',sans-serif; font-weight:700;
  font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .15s ease, box-shadow .15s ease; -webkit-user-select:none; user-select:none;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent-grad); color:#fff; box-shadow:0 10px 24px rgba(90,79,224,.35);}
.btn-primary.full{width:100%;}
.btn-ghost{background:var(--chip); color:var(--text); border:1px solid var(--border); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); box-shadow:inset 0 1px 0 var(--rim-top);}
.btn-ghost.full{width:100%;}
.btn-outline{background:rgba(255,255,255,.04); border:1.5px solid var(--accent); color:var(--accent); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);}
.btn-sm{padding:9px 14px; font-size:13px; border-radius:12px;}
.btn-danger{background:rgba(224,67,90,.14); color:var(--danger); border:1px solid rgba(224,67,90,.3); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);}
.btn-success{background:rgba(18,164,84,.14); color:var(--success); border:1px solid rgba(18,164,84,.3); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);}
input,select,textarea{
  width:100%; background:var(--chip); border:1px solid var(--border); border-radius:14px;
  padding:13px 14px; font-family:'Inter',sans-serif; font-size:14.5px; color:var(--text); outline:none;
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); box-shadow:inset 0 1px 0 var(--rim-top);
  color-scheme:light; /* keeps native pickers (date, select list) readable per-theme, set below */
}
textarea{resize:none; min-height:80px;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
input::placeholder, textarea::placeholder{color:var(--text-3); opacity:1;}
input:disabled, select:disabled, textarea:disabled{
  color:var(--text-2); -webkit-text-fill-color:var(--text-2); opacity:1;
}
[data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea{color-scheme:dark;}
select{color:var(--text);}
select option{background:var(--glass-hi); color:var(--text);}
label{font-size:12.5px; font-weight:700; color:var(--text-2); margin:0 0 6px 2px; display:block; letter-spacing:.2px;}
.field{margin-bottom:14px;}
.link{color:var(--accent); font-weight:700; cursor:pointer;}
.muted{color:var(--text-2);}
.center{text-align:center;}
.row{display:flex; align-items:center;}
.between{justify-content:space-between;}
.gap8{gap:8px;} .gap10{gap:10px;} .gap12{gap:12px;} .gap6{gap:6px;}
.icon-btn{
  width:40px; height:40px; border-radius:14px; background:var(--chip); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:17px;
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); box-shadow:inset 0 1px 0 var(--rim-top);
}
.icon-btn:active{transform:scale(.92);}

/* status badges */
.badge{padding:5px 11px; border-radius:100px; font-size:11px; font-weight:800; letter-spacing:.2px; white-space:nowrap;}
.badge-pending{background:rgba(140,146,180,.18); color:var(--text-2);}
.badge-verified{background:rgba(63,123,240,.15); color:var(--info);}
.badge-progress{background:rgba(224,138,30,.15); color:var(--warn);}
.badge-resolved{background:rgba(18,164,84,.15); color:var(--success);}
.badge-escalated{background:rgba(224,67,90,.15); color:var(--danger);}
.badge-pushed{background:rgba(90,79,224,.15); color:var(--accent);}

/* bottom nav */
.bottomnav{
  position:absolute; bottom:0; left:0; right:0; background:var(--nav);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--border); box-shadow:inset 0 1px 0 var(--rim-top);
  display:flex; padding:10px 8px calc(env(safe-area-inset-bottom) + 10px);
  z-index:40;
}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; padding:6px 2px; border-radius:14px; color:var(--text-3);}
.nav-item.active{color:var(--accent);}
.nav-item .ni-icon{font-size:19px;}
.nav-item .ni-fab{width:46px; height:46px; border-radius:16px; background:var(--accent-grad); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; margin-top:-24px; box-shadow:0 10px 22px rgba(90,79,224,.4); font-weight:700;}
.nav-label{font-size:10px; font-weight:700;}

/* complaint card */
.complaint-card{
  display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:18px;
  background:var(--glass); border:1px solid var(--border); cursor:pointer; margin-bottom:10px;
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--rim-top), inset 0 -1px 0 var(--rim-bottom), 0 6px 18px rgba(30,35,80,.08);
  position:relative; overflow:hidden; isolation:isolate; transition:transform .15s ease;
}
.complaint-card::before{
  content:''; position:absolute; inset:0; z-index:-1; border-radius:inherit;
  background:var(--sheen); mix-blend-mode:soft-light; pointer-events:none;
}
.complaint-card:active{transform:scale(.985);}
.cat-icon{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
.cc-title{font-weight:700; font-size:14.5px; margin:0 0 2px;}
.cc-meta{font-size:12px; color:var(--text-3);}

/* verification button - the signature moment */
.verify-pill{
  display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 16px; border-radius:100px;
  font-weight:800; font-size:12.5px; cursor:pointer; border:1.5px solid transparent; white-space:nowrap;
  transition:width .45s cubic-bezier(.34,1.56,.64,1), padding .4s ease, background .35s ease, border-color .35s ease;
  overflow:hidden; position:relative; backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
.verify-pill.unverified{background:rgba(18,164,84,.12); color:var(--success); border-color:rgba(18,164,84,.35);}
.verify-pill.verifying{width:36px; padding:0; background:rgba(63,123,240,.12); border-color:rgba(63,123,240,.35); justify-content:center;}
.verify-pill.verified{background:rgba(18,164,84,.16); color:var(--success); border-color:rgba(18,164,84,.4);}
.verify-pill.rejected{background:rgba(224,67,90,.14); color:var(--danger); border-color:rgba(224,67,90,.35);}
.verify-pill .vp-text{white-space:nowrap; transition:opacity .2s ease;}
.verify-pill.verifying .vp-text{display:none;}
.spinner-ring{width:16px; height:16px; border-radius:50%; border:2.5px solid rgba(63,123,240,.25); border-top-color:var(--accent-2); animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.pulse-ok{animation:pulseOk .5s ease;}
@keyframes pulseOk{0%{box-shadow:0 0 0 0 rgba(18,164,84,.45);} 100%{box-shadow:0 0 0 14px rgba(18,164,84,0);}}
.verifying-caption{font-size:11.5px; color:var(--accent-2); font-weight:700; margin-top:6px;}

/* upvote */
.upvote-btn{
  display:flex; flex-direction:column; align-items:center; gap:2px; background:var(--chip); border:1px solid var(--border);
  border-radius:14px; padding:8px 12px; cursor:pointer; min-width:52px;
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); box-shadow:inset 0 1px 0 var(--rim-top);
}
.upvote-btn.voted{background:rgba(90,79,224,.15); border-color:rgba(90,79,224,.4); color:var(--accent);}
.upvote-btn:active .uv-arrow{animation:bump .3s ease;}
@keyframes bump{0%{transform:translateY(0);}40%{transform:translateY(-4px);}100%{transform:translateY(0);}}
.uv-arrow{font-size:15px; line-height:1;}
.uv-count{font-size:12px; font-weight:800;}

/* timeline */
.tl-item{display:flex; gap:12px; margin-bottom:2px;}
.tl-dot-col{display:flex; flex-direction:column; align-items:center;}
.tl-dot{width:12px; height:12px; border-radius:50%; background:var(--text-3); flex-shrink:0; margin-top:3px;}
.tl-dot.done{background:var(--success);}
.tl-dot.escalated{background:var(--danger);}
.tl-line{width:2px; flex:1; background:var(--border); min-height:26px;}
.tl-body{padding-bottom:18px;}
.tl-title{font-weight:700; font-size:13.5px;}
.tl-date{font-size:11.5px; color:var(--text-3);}

/* toggle */
.seg{
  display:flex; background:var(--chip); border-radius:14px; padding:4px; gap:4px;
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); box-shadow:inset 0 1px 0 var(--rim-top);
}
.seg-item{flex:1; text-align:center; padding:9px; border-radius:11px; font-weight:700; font-size:13px; cursor:pointer; color:var(--text-2); transition:background .2s ease, color .2s ease;}
.seg-item.active{background:var(--glass-hi); color:var(--accent); box-shadow:0 3px 10px rgba(20,24,60,.12), inset 0 1px 0 rgba(255,255,255,.5);}

.switch{width:44px; height:26px; border-radius:100px; background:var(--chip); border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0;}
.switch.on{background:var(--accent-grad); border-color:transparent;}
.switch .knob{width:20px; height:20px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left .25s ease; box-shadow:0 2px 5px rgba(0,0,0,.2);}
.switch.on .knob{left:20px;}

.chip{
  padding:6px 12px; border-radius:100px; background:var(--chip); border:1px solid var(--border);
  font-size:12px; font-weight:700; color:var(--text-2); cursor:pointer;
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--rim-top);
}
.chip.active{background:var(--accent-grad); color:#fff; border-color:transparent; box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px rgba(90,79,224,.35);}

.kpi{
  background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:12px; text-align:center;
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--rim-top), inset 0 -1px 0 var(--rim-bottom);
  position:relative; overflow:hidden; isolation:isolate;
}
.kpi::before{content:'';position:absolute; inset:0; z-index:-1; border-radius:inherit; background:var(--sheen); mix-blend-mode:soft-light; pointer-events:none;}
.kpi .kn{font-family:'Manrope'; font-weight:800; font-size:19px;}
.kpi .kl{font-size:10.5px; color:var(--text-3); font-weight:700; margin-top:2px;}

.empty{padding:36px 20px; text-align:center;}
.empty .ee{font-size:38px; margin-bottom:10px;}

.toast{
  position:absolute; left:20px; right:20px; bottom:100px; background:var(--text); color:var(--bg-1);
  padding:13px 16px; border-radius:16px; font-size:13px; font-weight:600; z-index:80;
  box-shadow:0 10px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.15);
  backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
  animation:toastIn .3s ease;
}
[data-theme="dark"] .toast{background:#eef0fb; color:#12142a;}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.gps-box{
  border:1.5px dashed var(--border); border-radius:16px; padding:14px; background:var(--chip);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--rim-top);
}
.gps-ok{border-color:rgba(18,164,84,.4); background:rgba(18,164,84,.1);}
.gps-bad{border-color:rgba(224,67,90,.4); background:rgba(224,67,90,.1);}

.avatar{width:38px; height:38px; border-radius:50%; background:var(--accent-grad); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; flex-shrink:0;}

.thumb{width:56px; height:56px; border-radius:12px; object-fit:cover; border:1px solid var(--border);}
.thumb-add{width:56px; height:56px; border-radius:12px; border:1.5px dashed var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-3); cursor:pointer; font-size:20px;}

.progressbar{height:6px; border-radius:100px; background:var(--chip); overflow:hidden;}
.progressbar > div{height:100%; background:var(--accent-grad); border-radius:100px;}

.priority-tag{font-weight:800; font-size:11px; padding:4px 10px; border-radius:100px;}
.pr-high{background:rgba(224,67,90,.15); color:var(--danger);}
.pr-medium{background:rgba(224,138,30,.15); color:var(--warn);}
.pr-low{background:rgba(63,123,240,.15); color:var(--info);}

::selection{background:rgba(90,79,224,.25);}
.hidden{display:none !important;}

/* --- Geospatial & Construction Area Mapping Styles --- */
.map-wrap {
  width: 100%;
  height: 270px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  overflow: hidden;
  position: relative;
  background: #0f1429;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.35);
  margin: 10px 0;
  z-index: 1;
}
.map-wrap-lg {
  height: 350px;
}
.draw-toolbar {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.draw-btn {
  padding: 6px 11px;
  font-size: 11.5px;
  font-weight: 700;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--glass);
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all .2s;
}
.draw-btn.active, .draw-btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.geo-banner {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  line-height: 1.5;
  margin: 10px 0;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.geo-banner-danger {
  background: rgba(224,67,90,0.14);
  border: 1px solid rgba(224,67,90,0.4);
  color: var(--danger);
}
.geo-banner-success {
  background: rgba(18,164,84,0.14);
  border: 1px solid rgba(18,164,84,0.4);
  color: var(--success);
}
.geo-banner-info {
  background: rgba(63,123,240,0.14);
  border: 1px solid rgba(63,123,240,0.4);
  color: var(--info);
}
.project-card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s ease, border-color .15s ease;
}
.project-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
}
.project-overlay-modal {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(10px);
  z-index: 10000;
  display: flex;
  align-items: flex-end;
  border-radius: 44px;
  overflow: hidden;
}
.project-modal-content {
  background: var(--glass-hi);
  border-top: 1px solid var(--border);
  border-radius: 28px 28px 0 0;
  padding: 22px 20px 28px;
  width: 100%;
  max-height: 85%;
  overflow-y: auto;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
}
.badge-local {
  background: rgba(224,138,30,0.18);
  color: var(--warn);
  border: 1px solid rgba(224,138,30,0.35);
}
.badge-major {
  background: rgba(63,123,240,0.18);
  color: var(--info);
  border: 1px solid rgba(63,123,240,0.35);
}
.leaflet-popup-content-wrapper, .leaflet-popup-tip {
  background: var(--glass-hi) !important;
  color: var(--text) !important;

/* --- Pure JS Point-in-Polygon Ray Casting & Geographic Validation --- */
function pointInPolygon(lat, lng, polygon) {
  if (!polygon || polygon.length < 3) return false;
  let inside = false;
  const n = polygon.length;
  let p1 = polygon[0];
  for (let i = 1; i <= n; i++) {
    const p2 = polygon[i % n];
    if ((p1[0] < lat && p2[0] >= lat) || (p2[0] < lat && p1[0] >= lat)) {
      if (lng <= (p2[1] - p1[1]) * (lat - p1[0]) / (p2[0] - p1[0]) + p1[1]) {
        inside = !inside;
      }
    }
    p1 = p2;
  }
  return inside;
}

function detectWardFromCoordinates(lat, lng) {
  for (const w of WARDS) {
    if (w.polygon && pointInPolygon(lat, lng, w.polygon)) {
      return w;
    }
  }
  return null;
}

function extractPointsFromGeometry(geom) {
  if (!geom) return [];
  const coords = geom.coordinates || [];
  if (geom.type === 'Point') return [coords];
  if (geom.type === 'LineString' || geom.type === 'Polyline') return coords;
  if (geom.type === 'Polygon' || geom.type === 'Rectangle') {
    return Array.isArray(coords[0]) && Array.isArray(coords[0][0]) ? coords[0] : coords;
  }
  return [];
}

function validateGeometryInsideWard(geom, ward) {
  if (!ward || !ward.polygon) return { valid: false, reason: 'Ward boundary is missing' };
  const pts = extractPointsFromGeometry(geom);
  if (!pts.length) return { valid: false, reason: 'No coordinates drawn yet.' };
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (!pointInPolygon(p[0], p[1], ward.polygon)) {
      return {
        valid: false,
        reason: `Point #${i + 1} (${p[0].toFixed(4)}, ${p[1].toFixed(4)}) falls outside your authorized ward (${ward.name}).`
      };
    }
  }
  return { valid: true };
}

function findAffectedWards(geom) {
  const pts = extractPointsFromGeometry(geom);
  const set = new Set();
  for (const p of pts) {
    const w = detectWardFromCoordinates(p[0], p[1]);
    if (w) set.add(w.id);
  }
  return Array.from(set);
}

function mkComplaint(o){
  const created = daysAgo(o.createdDaysAgo);
  const timeline = [{title:'Reported', date:fmtDate(created)}];
  if(o.communityVerified) timeline.push({title:'Community verification completed', date:fmtDate(daysAgo(o.createdDaysAgo-1))});
  if(o.govVerified) timeline.push({title:'Government authority verified', date:fmtDate(daysAgo(o.createdDaysAgo-2))});
  timeline.push({title:'Assigned to '+o.assigned, date:fmtDate(daysAgo(o.createdDaysAgo-2))});
  if(o.status==='progress'||o.status==='resolved'||o.status==='escalated') timeline.push({title:'Work in progress', date:fmtDate(daysAgo(Math.max(o.createdDaysAgo-4,0)))});
  if(o.escalated){
    timeline.push({title:'14-day deadline passed', date:fmtDate(daysAgo(o.createdDaysAgo-14)), escalated:true});
    timeline.push({title:'Escalated to '+o.assigned, date:fmtDate(daysAgo(o.createdDaysAgo-15)), escalated:true});
  }
  if(o.status==='resolved') timeline.push({title:'Resolved by '+o.assigned, date:fmtDate(daysAgo(o.resolvedDaysAgo||0)), done:true});
  return {
    id:o.id, category:o.category, title:o.title, description:o.desc, wardId:o.wardId,
    status:o.status, severity:o.severity, upvotes:o.upvotes, voted:false,
    daysPending:o.daysPending, communityVerified:o.communityVerified, govVerified:o.govVerified,
    verificationStatus: o.govVerified?'VERIFIED':'UNVERIFIED',

    timeline, comments: seedComments(o.id),
    images:[], reporterAnonymous:true,
  };
}

function priorityScore(c){
  const base = c.severity*10;
  const community = Math.min(c.upvotes*0.6, 60);
  const time = Math.min(c.daysPending*3, 45);
  const verify = c.govVerified?20:(c.communityVerified?10:0);

  return Math.round(base+community+time+verify+safety);
}

async function submitComplaint(){
  const desc = document.getElementById('desc-input');
  const cat = CAT(state.raise.category);
  const descriptionText = (desc&&desc.value)||'No description provided.';

  // Build a human-readable location string from the ward the local demo already resolved via GPS.
  let locationText = 'Anonymous / unspecified location';
  if(cat.geoLock && state.raise.ward){
    const w = W(state.raise.ward);
    if(w) locationText = `${w.village}, ${w.name}, ${w.district}, ${w.state}`;
  }

  // Try the real backend first. This never blocks the existing local-demo flow below —
  // if the network call fails for any reason, the app still behaves exactly as it did before.
  let realId = null;
  let translatedText = null;
  let detectedLanguage = null;
  try {
    const formData = new FormData();
    formData.append('category', cat.label);
    formData.append('location', locationText);
    formData.append('description', descriptionText);
    formData.append('target_language', 'en');
    formData.append('latitude', state.raise.lat || 26.850);
    formData.append('longitude', state.raise.lng || 80.945);
    formData.append('ward_id', state.raise.ward || 'ward24');
    state.raise.images.forEach(img => { if(img.file) formData.append('photos', img.file); });

    const res = await fetch(`${API_BASE}/complaints`, { method: 'POST', body: formData });
    if(res.ok){
      const data = await res.json();
      realId = data.id ? data.id.replace('#','') : null;
      // Only worth showing a translation if it actually differs from the original —
      // otherwise it's just noise (e.g. the complaint was already in English).
      if(data.translated_text && data.translated_text.trim() !== descriptionText.trim()){
        translatedText = data.translated_text;
      }
      if(data.detected_language && data.detected_language !== 'unknown'){
        detectedLanguage = data.detected_language;
      }
    }
  } catch(err) {
    // Backend unreachable — fall through to the local-only simulated ID below.
    console.warn('Backend submit failed, continuing with local simulation only:', err);
  }

  const id = realId || ('CMP'+Math.floor(10000+Math.random()*89999));
  const targetWardId = state.raise.ward || state.citizenWardId || 'ward24';
  const targetWard = W(targetWardId);

  const c = mkComplaint({
    id, category:cat.id, title:cat.label+' Report', desc: descriptionText,
    wardId: targetWardId, status:'pending', severity:state.raise.severity,
    upvotes:0, daysPending:0, communityVerified:false, govVerified:false,
    assigned: targetWard ? targetWard.councillor : 'Ward Councillor',
    createdDaysAgo:0, isCrime:cat.id==='crime',
  });
  c.latitude = state.raise.lat || targetWard.center[0];
  c.longitude = state.raise.lng || targetWard.center[1];
  c.wardName = targetWard.name;
  c.translatedText = translatedText;
  c.detectedLanguage = detectedLanguage;
  c.images = state.raise.images;
  complaints.unshift(c);
  state.lastSubmittedId = id;
  notifications.unshift({text:`Your concern has been forwarded to the appropriate authority. (#${id})`, time:'just now', read:false});
  nav('submit-success',{replace:true});
}

function toggleWhy(el){ const p = el.nextElementSibling; p.classList.toggle('hidden'); }
function toggleVote(id){
  const c = complaints.find(x=>x.id===id);
  if(c.voted){ c.voted=false; c.upvotes--; } else { c.voted=true; c.upvotes++; }
  render();
}

function verifyPillHTML(c, ctx){
  const vs = c._vstate || (c.verificationStatus==='VERIFIED'?'verified':c.verificationStatus==='REJECTED'?'rejected':'unverified');
  if(vs==='verifying'){
    return `<div class="verify-pill verifying"><div class="spinner-ring"></div></div>`;
  }
  if(vs==='verified'){
    return `<div class="verify-pill verified" onclick="event.stopPropagation()"><span>✓</span><span class="vp-text">Verified</span></div>`;
  }
  if(vs==='rejected'){
    return `<div class="verify-pill rejected" onclick="retryVerify('${c.id}','${ctx}')"><span>!</span><span class="vp-text">Verification Failed</span></div>`;
  }
  return `<div class="verify-pill unverified" onclick="startVerify('${c.id}','${ctx}')"><span>✓</span><span class="vp-text">Verification</span></div>`;
}
function startVerify(id, ctx){
  const c = complaints.find(x=>x.id===id);
  c._vstate='verifying'; render();
  setTimeout(()=>{
    const success = Math.random()>0.12;
    c._vstate = success?'verified':'rejected';
    if(success){ c.verificationStatus='VERIFIED'; c.govVerified=true; }
    render();
    if(success) toast('Complaint verified successfully');
    else toast('Verification failed — you can retry');
  }, 1600);
}
function retryVerify(id, ctx){ startVerify(id, ctx); }

function screenGovDashboard(){

  let list = complaints.filter(role.filter);
  if(state.govSort==='priority') list = [...list].sort((a,b)=>priorityScore(b)-priorityScore(a));
  else if(state.govSort==='upvoted') list = [...list].sort((a,b)=>b.upvotes-a.upvotes);
  else if(state.govSort==='oldest') list = [...list].sort((a,b)=>a.createdAt-b.createdAt);
  else if(state.govSort==='escalated') list = list.filter(c=>c.escalated);
  else if(state.govSort==='unverified') list = list.filter(c=>!c.govVerified);

  // Authority Construction Projects in scope
  const isWardOfficial = (role.id === 'WARD_COUNCILLOR');
  const managedProjects = constructionProjects.filter(p => {
    if(isWardOfficial) return p.authorityWardId === state.councillorWardId;
    return true; // SDM, DM, CM, PM see all projects in administrative territory
  });

  const kpis = {
    total:list.length, pending:list.filter(c=>c.status==='pending').length,
    progress:list.filter(c=>c.status==='progress').length, resolved:list.filter(c=>c.status==='resolved').length,
    escalated:list.filter(c=>c.escalated).length, high:list.filter(c=>priorityLevel(priorityScore(c))==='HIGH').length,
  };

  const constructionKpis = {
    total: managedProjects.length,
    underConstruction: managedProjects.filter(p=>p.status==='Under Construction').length,
    delayed: managedProjects.filter(p=>p.status==='Delayed').length,
    majorInfra: managedProjects.filter(p=>p.projectType==='MAJOR_INFRASTRUCTURE').length,

  return `
  <div class="screen">
    <div class="row between" style="margin:20px 0 4px;">
      <div>
        <div style="font-weight:800;font-size:17px;" class="display">${role.label}</div>

    <!-- Ward Switcher for Ward Councilor Demo -->
    ${isWardOfficial ? `
      <div class="row between" style="margin-bottom:12px;background:var(--glass);padding:6px 12px;border-radius:10px;font-size:12px;">
        <span class="muted">Assigned Ward:</span>
        <select style="width:auto;padding:4px 8px;font-size:12px;font-weight:700;" onchange="state.councillorWardId=this.value;render();">
          ${WARDS.map(w=>`<option value="${w.id}" ${w.id===state.councillorWardId?'selected':''}>${w.name}</option>`).join('')}
        </select>
      </div>
    ` : ''}

    <!-- Action Button: Add Construction Project -->
    <button class="btn btn-primary full gap10" style="margin-bottom:14px;box-shadow:0 8px 24px rgba(90,79,224,.35);" onclick="openNewConstructionFlow()">
      <span>🚧</span> Map New Construction Project
    </button>

    <!-- Section Tabs -->
    <div class="seg" style="margin-bottom:14px;">
      <div class="seg-item ${state.govTab==='complaints'?'active':''}" onclick="state.govTab='complaints';render()">📋 Complaints (${list.length})</div>
      <div class="seg-item ${state.govTab==='construction'?'active':''}" onclick="state.govTab='construction';render()">🚧 Construction (${managedProjects.length})</div>
    </div>

    ${state.govTab === 'complaints' ? `

    `}

  state.newProject.validationMsg = '';

function calculateDurationDays(d1, d2){
  try {
    const t1 = new Date(d1).getTime();
    const t2 = new Date(d2).getTime();
    return Math.max(1, Math.round((t2 - t1) / (1000 * 3600 * 24)));
  } catch(e) {
    return 14;
  }
}

function updateProjectDates(start, end){
  if(start) state.newProject.startDate = start;
  if(end) state.newProject.endDate = end;
  const days = calculateDurationDays(state.newProject.startDate, state.newProject.endDate);
  const el = document.getElementById('np-duration-calc');
  if(el) el.textContent = `${days} days (${(days/30.4).toFixed(1)} months)`;
  state.newProject.sla = `${days} days`;
  const slaEl = document.getElementById('np-sla');
  if(slaEl && !slaEl.value) slaEl.value = `${days} days`;
}

async function submitNewConstructionProject(){
  const np = state.newProject;
  const name = document.getElementById('np-name')?.value || np.name || 'Civil Infrastructure Works';
  const desc = document.getElementById('np-desc')?.value || np.description || 'Civic infrastructure improvement.';
  const alt = document.getElementById('np-alt')?.value || np.altRoute || '';
  const sla = document.getElementById('np-sla')?.value || np.sla || '14 days';
  const isLocal = (np.type === 'LOCAL_WARD');
  const wardId = isLocal ? state.councillorWardId : null;

  if(!np.geometry){
    toast('Please draw the affected construction area on the map first.');
    return;
  }

  // Backend geographic verification call
  const payload = {
    name,
    project_type: np.type,
    authority_id: state.activeGovRole.toLowerCase() + '-user',
    authority_role: state.activeGovRole,
    authority_ward_id: wardId,
    geometry_type: np.geometry.type,
    geometry: np.geometry,
    start_date: np.startDate,
    estimated_end_date: np.endDate,
    official_sla: sla,
    status: np.status,
    description: desc,
    alternative_route: alt,
    visibility_scope: isLocal ? 'WARD' : 'PUBLIC_CITY'
  };

  let createdProject = null;
  try {
    const res = await fetch(`${API_BASE}/construction-projects`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(res.ok){
      createdProject = await res.json();
    } else if(res.status === 403) {
      const err = await res.json();
      alert(`Backend Authorization Error: ${err.detail || 'Geographic boundary permission denied.'}`);
      return;
    }
  } catch(e) {
    console.warn('Real backend unreachable, persisting to local prototype store:', e);
  }

  const projId = (createdProject && createdProject.project_no) || ('PRJ-' + Math.floor(1000 + Math.random()*8999));
  const newLocalObj = {
    id: projId,
    name,
    projectType: np.type,
    authorityId: state.activeGovRole.toLowerCase(),
    authorityRole: state.activeGovRole,
    authorityWardId: wardId,
    affectedWardIds: isLocal ? [wardId] : findAffectedWards(np.geometry),
    geometryType: np.geometry.type,
    geometry: np.geometry,
    startDate: np.startDate,
    estimatedEndDate: np.endDate,
    durationDays: calculateDurationDays(np.startDate, np.endDate),
    officialSla: sla,
    actualCompletionDate: null,
    status: np.status,
    description: desc,
    alternativeRoute: alt,
    visibilityScope: isLocal ? 'WARD' : 'PUBLIC_CITY',
    createdAt: new Date(),
  };

  constructionProjects.unshift(newLocalObj);
  notifications.unshift({
    text: `New construction project "${name}" has been mapped and published.`,
    time: 'just now',
    read: false
  });

  state.govTab = 'construction';
  toast('Construction area published successfully!');
  nav('gov-dashboard', { replace: true });
}

let constMapTileMode = 'satellite';

function toggleCivMapTile(){
  civMapTileMode = (civMapTileMode === 'satellite') ? 'street' : 'satellite';
  const btn = document.getElementById('civ-map-tile-btn');
  if(btn) btn.textContent = (civMapTileMode === 'satellite') ? '🛰️ Satellite' : '🗺️ Street';
  initCivilianMap();
}

function toggleConstructionTile(){
  constMapTileMode = (constMapTileMode === 'satellite') ? 'street' : 'satellite';
  initConstructionMap();
}

function getTileLayer(mode){
  if(mode === 'street'){
    return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    });
  }
  // Esri World Imagery Satellite
  return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Esri Satellite'
  });
}

function initRaiseMap(){
  const container = document.getElementById('raise-map');
  if(!container) return;
  if(typeof L === 'undefined'){
    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-3);font-size:12px;">Satellite Map Preview</div>`;
    return;
  }

  if(activeRaiseMap){
    try { activeRaiseMap.remove(); } catch(e){}
    activeRaiseMap = null;
  }

  const lat = state.raise.lat || 26.850;
  const lng = state.raise.lng || 80.945;
  const detected = detectWardFromCoordinates(lat, lng) || W(state.citizenWardId);

  activeRaiseMap = L.map('raise-map', { zoomControl: false, attributionControl: false }).setView([lat, lng], 14);
  getTileLayer('satellite').addTo(activeRaiseMap);

  // Draw detected ward polygon outline
  if(detected && detected.polygon){
    L.polygon(detected.polygon, {
      color: '#5a4fe0',
      fillColor: '#5a4fe0',
      fillOpacity: 0.15,
      weight: 2,
      dashArray: '4,4'
    }).addTo(activeRaiseMap);
  }

  // Draggable location pin
  activeRaiseMarker = L.marker([lat, lng], { draggable: true }).addTo(activeRaiseMap);
  activeRaiseMarker.on('dragend', function(e){
    const pos = e.target.getLatLng();
    setRaiseCoords(pos.lat, pos.lng);
  });

  activeRaiseMap.on('click', function(e){
    setRaiseCoords(e.latlng.lat, e.latlng.lng);
  });

  setTimeout(()=>{ if(activeRaiseMap) activeRaiseMap.invalidateSize(); }, 150);
}

function initCivilianMap(){
  const container = document.getElementById('civilian-map');
  if(!container) return;
  if(typeof L === 'undefined'){
    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-3);font-size:12px;">Satellite Civic Map Preview</div>`;
    return;
  }

  if(activeCivMap){
    try { activeCivMap.remove(); } catch(e){}
    activeCivMap = null;
  }

  const homeWard = W(state.citizenWardId);
  activeCivMap = L.map('civilian-map', { zoomControl: true, attributionControl: false }).setView(homeWard.center, 13);
  getTileLayer(civMapTileMode).addTo(activeCivMap);

  // 1. Draw Home Ward Boundary in prominent outline
  if(homeWard.polygon){
    L.polygon(homeWard.polygon, {
      color: '#12a454',
      fillColor: '#12a454',
      fillOpacity: 0.08,
      weight: 2
    }).addTo(activeCivMap).bindPopup(`<b>Your Ward Jurisdiction: ${homeWard.name}</b>`);
  }

  // 2. Draw Active Construction Layer according to visibility rules
  constructionProjects.forEach(p => {
    if(p.status === 'Completed') return;
    if(state.constructionFilter === 'active' && p.status !== 'Under Construction') return;
    if(state.constructionFilter === 'delayed' && p.status !== 'Delayed') return;

    // Visibility Rule:
    // Major Infrastructure -> visible to everyone
    // Local Ward -> visible ONLY if matching citizen's ward!
    const isMajor = (p.projectType === 'MAJOR_INFRASTRUCTURE');
    if(!isMajor && p.authorityWardId !== state.citizenWardId) return;

    const isDelayed = (p.status === 'Delayed');
    const color = isDelayed ? '#e0435a' : (isMajor ? '#3f7bf0' : '#e08a1e');

    if(p.geometryType === 'LineString' || (p.geometry && p.geometry.type === 'LineString')){
      const pts = p.geometry.coordinates || [];
      const line = L.polyline(pts, {
        color: color,
        weight: 6,
        opacity: 0.85
      }).addTo(activeCivMap);
      line.on('click', () => openProjectModal(p.id));
      line.bindTooltip(`<b>${p.name}</b><br>${p.status} · ${p.officialSla}`);
    } else {
      const coords = extractPointsFromGeometry(p.geometry);
      if(coords.length >= 3){
        const poly = L.polygon(coords, {
          color: color,
          fillColor: color,
          fillOpacity: 0.35,
          weight: 2,
          dashArray: isDelayed ? '5,5' : null
        }).addTo(activeCivMap);
        poly.on('click', () => openProjectModal(p.id));
        poly.bindTooltip(`<b>${p.name}</b><br>${p.status} · ${p.officialSla}`);
      }
    }
  });

  // 3. Draw Local Complaints in active ward
  complaints.filter(c => c.wardId === state.citizenWardId).forEach(c => {
    const lat = c.latitude || homeWard.center[0] + (Math.random()-0.5)*0.015;
    const lng = c.longitude || homeWard.center[1] + (Math.random()-0.5)*0.015;
    const circle = L.circleMarker([lat, lng], {
      radius: 6,
      fillColor: '#5a4fe0',
      color: '#fff',
      weight: 1.5,
      fillOpacity: 0.9
    }).addTo(activeCivMap);
    circle.bindTooltip(`<b>#${c.id}</b>: ${c.title}`);
    circle.on('click', () => openComplaint(c.id));
  });

  setTimeout(()=>{ if(activeCivMap) activeCivMap.invalidateSize(); }, 150);
}

function initConstructionMap(){
  const container = document.getElementById('construction-map');
  if(!container) return;
  if(typeof L === 'undefined'){
    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-3);font-size:12px;">Satellite Construction Map Preview</div>`;
    return;
  }

  if(activeConstMap){
    try { activeConstMap.remove(); } catch(e){}
    activeConstMap = null;
  }

  const np = state.newProject;
  const isLocal = (np.type === 'LOCAL_WARD');
  const assignedWard = W(state.councillorWardId);

  const center = isLocal ? assignedWard.center : [26.855, 80.950];
  const zoom = isLocal ? 14 : 12;

  activeConstMap = L.map('construction-map', { zoomControl: true, attributionControl: false }).setView(center, zoom);
  getTileLayer(constMapTileMode).addTo(activeConstMap);

  // Clearly outline assigned ward boundary for Local projects
  if(isLocal && assignedWard.polygon){
    L.polygon(assignedWard.polygon, {
      color: '#12a454',
      fillColor: '#12a454',
      fillOpacity: 0.12,
      weight: 3,
      dashArray: '3,3'
    }).addTo(activeConstMap).bindTooltip(`<b>Authorized Ward Boundary: ${assignedWard.name}</b>`, { permanent: true, direction: 'top' });

    // Fit map precisely to the authority's ward
    activeConstMap.fitBounds(assignedWard.polygon);
  }

  // Draw any points already placed
  if(np.drawnPoints && np.drawnPoints.length){
    redrawConstructionShape();
  }

  // Interactive drawing click handlers
  activeConstMap.on('click', function(e){
    const pt = [e.latlng.lat, e.latlng.lng];
    handleDrawingClick(pt);
  });

  setTimeout(()=>{ if(activeConstMap) activeConstMap.invalidateSize(); }, 150);
}

function handleDrawingClick(pt){
  const np = state.newProject;
  const assignedWard = W(state.councillorWardId);

  if(np.drawMode === 'rectangle'){
    if(np.drawnPoints.length === 0){
      np.drawnPoints.push(pt);
      toast('Click opposite corner to form rectangle.');
    } else {
      const p1 = np.drawnPoints[0];
      const p2 = pt;
      const rect = [
        [p1[0], p1[1]],
        [p1[0], p2[1]],
        [p2[0], p2[1]],
        [p2[0], p1[1]],
        [p1[0], p1[1]]
      ];
      np.drawnPoints = rect;
      np.geometry = { type: 'Polygon', coordinates: rect };
      validateAndRenderDrawnShape();
    }
    return;
  }

  // Polygon or Line
  np.drawnPoints.push(pt);
  if(np.drawMode === 'line'){
    np.geometry = { type: 'LineString', coordinates: np.drawnPoints };
  } else {
    // Polygon: close the ring
    const closed = [...np.drawnPoints];
    if(closed.length >= 3) closed.push(closed[0]);
    np.geometry = { type: 'Polygon', coordinates: closed };
  }

  validateAndRenderDrawnShape();
}

function validateAndRenderDrawnShape(){
  const np = state.newProject;
  const isLocal = (np.type === 'LOCAL_WARD');
  const assignedWard = W(state.councillorWardId);

  if(isLocal){
    const val = validateGeometryInsideWard(np.geometry, assignedWard);
    np.isValid = val.valid;
    np.validationMsg = val.valid ? `All coordinates are strictly contained inside ${assignedWard.name}.` : val.reason;
  } else {
    // Major infrastructure
    const affected = findAffectedWards(np.geometry);
    np.isValid = (np.drawnPoints.length >= 2);
    np.validationMsg = `Major infrastructure touches ${affected.length} ward(s): ${affected.map(id=>W(id).name).join(', ')}`;
  }

  // Update UI warning box
  const box = document.getElementById('boundary-status-box');
  if(box){
    box.innerHTML = np.isValid ? `
      <div class="geo-banner geo-banner-success">
        <span>✓</span>
        <div><b>Boundary Authorization Verified:</b> ${np.validationMsg}</div>
      </div>
    ` : `
      <div class="geo-banner geo-banner-danger">
        <span>⚠️</span>
        <div><b>Geographic Authorization Block:</b> ${np.validationMsg}</div>
      </div>
    `;
  }

  const pubBtn = document.getElementById('np-publish-btn');
  if(pubBtn){
    if(np.isValid){
      pubBtn.style.opacity = '1';
      pubBtn.style.pointerEvents = 'auto';
    } else {
      pubBtn.style.opacity = '.5';
      pubBtn.style.pointerEvents = 'none';
    }
  }

  redrawConstructionShape();
}

function redrawConstructionShape(){
  if(!activeConstMap) return;
  if(constDrawnLayer){
    try { activeConstMap.removeLayer(constDrawnLayer); } catch(e){}
    constDrawnLayer = null;
  }

  const np = state.newProject;
  if(!np.geometry) return;

  const color = np.isValid ? '#12a454' : '#e0435a';
  if(np.geometry.type === 'LineString'){
    constDrawnLayer = L.polyline(np.geometry.coordinates, { color, weight: 6 }).addTo(activeConstMap);
  } else {
    constDrawnLayer = L.polygon(np.geometry.coordinates, {
      color, fillColor: color, fillOpacity: 0.35, weight: 2
    }).addTo(activeConstMap);
  }
}

/* ---------------- INIT ---------------- */
function tickClock(){
  const el = document.getElementById('clock');
  if(el) el.textContent = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});
}
(async function init(){
  await loadTheme();
  document.getElementById('phone').setAttribute('data-theme', state.theme);
  render();
  tickClock(); setInterval(tickClock, 30000);
})();
</script>
